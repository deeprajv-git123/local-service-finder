<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Service Categories</title>
</head>
<body>
    <h2>Select a Service Category</h2>
    <ul>
        {% for category in categories %}
            <li>
                <a href="{% url 'service_list' category.id %}">{{ category.name }}</a>
            </li>
        {% empty %}
            <p>No categories available right now.</p>
        {% endfor %}
    </ul>
    <a href="{% url 'home' %}">Back to Home</a>
</body>
</html>
