{% extends 'services/base.html' %}

{% block content %}
    <div style="background: white; border: 1px solid #ccc; padding: 20px; border-radius: 8px; max-width: 500px; margin: 0 auto;">
        <h2>Review: {{ booking.service.title }}</h2>
        <p><strong>Provider:</strong> {{ booking.service.provider.username }}</p>

        <form method="POST" style="margin-top: 20px;">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" style="background-color: #f39c12; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold;">Submit Review</button>
        </form>

        <br>
        <a href="{% url 'dashboard' %}" style="color: #7f8c8d; text-decoration: none;">Cancel</a>
    </div>
{% endblock %}
