{% extends 'services/base.html' %}

{% block content %}
    <div style="background: white; border: 1px solid #ccc; padding: 20px; border-radius: 8px;">
        <h2>Book Service: {{ service.title }}</h2>
        <p><strong>Provider:</strong> {{ service.provider.username }}</p>
        <p><strong>Rate:</strong> ₹{{ service.hourly_rate }} / hr</p>

        <form method="POST" style="margin-top: 20px;">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" style="background-color: #27ae60; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">Submit Booking Request</button>
        </form>

        <br><br>
        <a href="{% url 'service_list' service.category.id %}" style="color: #c0392b; text-decoration: none;">Cancel and go back</a>
    </div>
{% endblock %}
