{% extends 'services/base.html' %}

{% block content %}
    <div style="background: white; border: 1px solid #ccc; padding: 20px; border-radius: 8px;">
        <h2>Manage Service Profile</h2>
        
        <form method="POST" style="margin-top: 20px;">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" style="background-color: #2c3e50; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">Save Profile</button>
        </form>

        <br><br>
        <a href="{% url 'dashboard' %}" style="color: #c0392b; text-decoration: none;">Cancel and go back</a>
    </div>
{% endblock %}
