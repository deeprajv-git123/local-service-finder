{% extends 'services/base.html' %}

{% block content %}
    <div style="background: white; border: 1px solid #ccc; padding: 20px; border-radius: 8px; max-width: 500px; margin: 0 auto;">
        <h2 style="text-align: center;">Join Local Service Finder</h2>
        
        <form method="POST" style="margin-top: 20px;">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" style="background-color: #3498db; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold;">Sign Up</button>
        </form>

        <p style="text-align: center; margin-top: 20px;">
            Already have an account? <a href="{% url 'login' %}" style="color: #2c3e50;">Log In here</a>.
        </p>
    </div>
{% endblock %}
